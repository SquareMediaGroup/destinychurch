[package]
name = "engine"
version = "0.1.0"
description = "Destiny Subtitles engine: transcript stabilising, caption formatting, rendering, NDI."
edition = "2021"
publish = false

[features]
# Real speech engine. Needs cmake. "metal" turns on GPU on Apple Silicon.
whisper = ["dep:whisper-rs"]
metal = ["whisper", "whisper-rs/metal"]

[dependencies]
serde = { version = "1", features = ["derive"] }
hound = "3.5"
libloading = "0.9"
cosmic-text = "0.19"
tiny-skia = "0.12"
whisper-rs = { version = "0.16", optional = true }

[dev-dependencies]
serde_json = "1"
