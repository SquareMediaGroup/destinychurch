[package]
name = "destiny-subtitles"
version = "0.1.0"
description = "Destiny Subtitles: live AI captions, NDI in to NDI out"
edition = "2021"
publish = false

[lib]
name = "destiny_subtitles_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
engine = { path = "../crates/engine" }
